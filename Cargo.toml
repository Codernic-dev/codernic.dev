# DEPRECATED: Superseded by Helonium v2.0 (helonium/); Rust layer is no longer maintained.
# DEPRECATED (Rust Legacy): Canonical sovereign implementation lives in ./helonium/ (Helonium v2.0). Retained for compatibility only.
[workspace]
members = [
    "crates/protocol",
    "crates/b2b/pirsig-protocol"
]
resolver = "2"

[workspace.dependencies]
codernic-nano = { path = "../codernic-nano" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
jsonschema = "0.18"
thiserror = "1.0"

[workspace.metadata.codernic]
rust_status = "deprecated"
helonium_canonical = "helonium/"
