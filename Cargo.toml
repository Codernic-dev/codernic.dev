[workspace]
members = [
    "crates/protocol",
    "crates/b2b/pirsig-protocol"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
jsonschema = "0.18"
hex = "0.4"
thiserror = "1.0"
ring = "0.17"
