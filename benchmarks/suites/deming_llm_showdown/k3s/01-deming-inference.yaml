apiVersion: v1
kind: Pod
metadata:
  name: deming-inference-pod
  namespace: deming-showdown
  labels:
    app.kubernetes.io/name: deming-inference
    bench.codernic.dev/engine: deming-ft
spec:
  restartPolicy: Never
  containers:
  - name: deming-engine
    image: localhost:5000/codernic/deming-engine:latest
    imagePullPolicy: IfNotPresent
    command: ["/app/target/release/deming_fusion_tensor_stress_bench"]
    resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "1000m"
        memory: "1Gi"
    volumeMounts:
    - name: models-volume
      mountPath: /models
      readOnly: true
  volumes:
  - name: models-volume
    hostPath:
      path: /home/tadeop/codernicapp/models
      type: Directory
