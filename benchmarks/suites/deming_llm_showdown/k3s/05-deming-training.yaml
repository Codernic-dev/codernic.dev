apiVersion: v1
kind: Pod
metadata:
  name: deming-training-pod
  namespace: deming-showdown
  labels:
    app.kubernetes.io/name: deming-training
    bench.codernic.dev/engine: deming-lora-trainer
spec:
  restartPolicy: Never
  containers:
  - name: lora-trainer
    image: localhost:5000/codernic/lora-trainer:latest
    imagePullPolicy: IfNotPresent
    command: ["/app/target/release/train", "--dataset", "/datasets/training_pairs.jsonl", "--strategy", "vulkan", "--rank", "16"]
    resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "1000m"
        memory: "1Gi"
    volumeMounts:
    - name: datasets-volume
      mountPath: /datasets
      readOnly: true
  volumes:
  - name: datasets-volume
    hostPath:
      path: /home/tadeop/dev/Codernic-Workspace/codernic-bench-standalone/benchmarks/suites/deming_llm_showdown/datasets
      type: Directory
