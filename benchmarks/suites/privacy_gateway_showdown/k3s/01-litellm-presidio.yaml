apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-presidio-bench
  namespace: privacy-showdown
  labels:
    app: litellm-presidio
    engine: python-presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-presidio
  template:
    metadata:
      labels:
        app: litellm-presidio
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MODE
              value: "PRODUCTION"
            - name: PRESIDIO_HOST
              value: "http://127.0.0.1:5001"
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: privacy-showdown
spec:
  selector:
    app: litellm-presidio
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
