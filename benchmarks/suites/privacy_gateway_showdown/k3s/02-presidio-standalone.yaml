apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-standalone-bench
  namespace: privacy-showdown
  labels:
    app: presidio-standalone
    engine: microsoft-presidio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-standalone
  template:
    metadata:
      labels:
        app: presidio-standalone
    spec:
      containers:
        - name: presidio-anonymizer
          image: mcr.microsoft.com/presidio/presidio-anonymizer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-service
  namespace: privacy-showdown
spec:
  selector:
    app: presidio-standalone
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
