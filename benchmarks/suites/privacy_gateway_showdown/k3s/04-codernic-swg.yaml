apiVersion: apps/v1
kind: Deployment
metadata:
  name: codernic-swg-bench
  namespace: privacy-showdown
  labels:
    app: codernic-swg
    engine: rust-native
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codernic-swg
  template:
    metadata:
      labels:
        app: codernic-swg
    spec:
      containers:
        - name: codernic-swg
          image: codernic/swg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: "info"
            - name: CODERNIC_SWG_PORT
              value: "8080"
            - name: SESSION_VAULT_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "64Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: codernic-swg-service
  namespace: privacy-showdown
spec:
  selector:
    app: codernic-swg
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
